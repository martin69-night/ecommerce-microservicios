services:
  mysql_catalogo:
    image: mysql:8.0
    container_name: mysql_catalogo
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: catalog_db
      MYSQL_USER: desarrollador
      MYSQL_PASSWORD: password_seguro_123
      MYSQL_ROOT_PASSWORD: root123
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql_inventario:
    image: mysql:8.0
    container_name: mysql_inventario
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: inventory_db
      MYSQL_USER: desarrollador
      MYSQL_PASSWORD: password_seguro_123
      MYSQL_ROOT_PASSWORD: root123
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql_carrito:
    image: mysql:8.0
    container_name: mysql_carrito
    ports:
      - "3308:3306"
    environment:
      MYSQL_DATABASE: cart_db
      MYSQL_USER: desarrollador
      MYSQL_PASSWORD: password_seguro_123
      MYSQL_ROOT_PASSWORD: root123
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql_ordenes:
    image: mysql:8.0
    container_name: mysql_ordenes
    ports:
      - "3309:3306"
    environment:
      MYSQL_DATABASE: order_db
      MYSQL_USER: desarrollador
      MYSQL_PASSWORD: password_seguro_123
      MYSQL_ROOT_PASSWORD: root123
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql_pagos:
    image: mysql:8.0
    container_name: mysql_pagos
    ports:
      - "3310:3306"
    environment:
      MYSQL_DATABASE: payment_db
      MYSQL_USER: desarrollador
      MYSQL_PASSWORD: password_seguro_123
      MYSQL_ROOT_PASSWORD: root123
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10

  api_catalogo:
    image: maven:3.9-eclipse-temurin-21
    container_name: api_catalogo
    working_dir: /app
    volumes:
      - ./catalog-service:/app
      - maven_repo:/root/.m2
    command: mvn spring-boot:run
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql_catalogo:3306/catalog_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: desarrollador
      SPRING_DATASOURCE_PASSWORD: password_seguro_123
      EUREKA_CLIENT_ENABLED: "false"
    depends_on:
      mysql_catalogo:
        condition: service_healthy
    networks:
      - ecommerce-net

  api_inventario:
    image: maven:3.9-eclipse-temurin-21
    container_name: api_inventario
    working_dir: /app
    volumes:
      - ./inventory-service:/app
      - maven_repo:/root/.m2
    command: mvn spring-boot:run
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql_inventario:3306/inventory_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: desarrollador
      SPRING_DATASOURCE_PASSWORD: password_seguro_123
      EUREKA_CLIENT_ENABLED: "false"
    depends_on:
      mysql_inventario:
        condition: service_healthy
    networks:
      - ecommerce-net

  api_carrito:
    image: maven:3.9-eclipse-temurin-21
    container_name: api_carrito
    working_dir: /app
    volumes:
      - ./cart-service:/app
      - maven_repo:/root/.m2
    command: mvn spring-boot:run
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql_carrito:3306/cart_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: desarrollador
      SPRING_DATASOURCE_PASSWORD: password_seguro_123
      CATALOG_SERVICE_URL: http://api_catalogo:8083
      EUREKA_CLIENT_ENABLED: "false"
    depends_on:
      mysql_carrito:
        condition: service_healthy
      api_catalogo:
        condition: service_started
    networks:
      - ecommerce-net

  api_ordenes:
    image: maven:3.9-eclipse-temurin-21
    container_name: api_ordenes
    working_dir: /app
    volumes:
      - ./order-service:/app
      - maven_repo:/root/.m2
    command: mvn spring-boot:run
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql_ordenes:3306/order_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: desarrollador
      SPRING_DATASOURCE_PASSWORD: password_seguro_123
      INVENTORY_SERVICE_URL: http://api_inventario:8084
      SPRING_CLOUD_OPENFEIGN_OKHTTP_ENABLED: "true"
      EUREKA_CLIENT_ENABLED: "false"
    depends_on:
      mysql_ordenes:
        condition: service_healthy
      api_inventario:
        condition: service_started
    networks:
      - ecommerce-net

  api_pagos:
    image: maven:3.9-eclipse-temurin-21
    container_name: api_pagos
    working_dir: /app
    volumes:
      - ./payment-service:/app
      - maven_repo:/root/.m2
    command: mvn spring-boot:run
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql_pagos:3306/payment_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: desarrollador
      SPRING_DATASOURCE_PASSWORD: password_seguro_123
      EUREKA_CLIENT_ENABLED: "false"
    depends_on:
      mysql_pagos:
        condition: service_healthy
    networks:
      - ecommerce-net

networks:
  ecommerce-net:

volumes:
  maven_repo:
